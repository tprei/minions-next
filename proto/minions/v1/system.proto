syntax = "proto3";

package minions.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "minions/v1/common.proto";

service SystemService {
  rpc GetServerInfo(GetServerInfoRequest) returns (GetServerInfoResponse);
  rpc GetHealth(GetHealthRequest) returns (GetHealthResponse);
  rpc RunDoctor(RunDoctorRequest) returns (RunDoctorResponse);
}

message GetServerInfoRequest {
  string client_name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
    pattern: "^[A-Za-z0-9][A-Za-z0-9._ -]*$"
  }];
  ApiVersion api_version = 2 [(buf.validate.field).required = true];
}

message GetServerInfoResponse {
  string server_version = 1 [(buf.validate.field).string = {pattern: "^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(?:-[0-9A-Za-z.-]+)?(?:\\+[0-9A-Za-z.-]+)?$"}];
  ApiVersion api_version = 2 [(buf.validate.field).required = true];
  repeated ServerCapability capabilities = 3 [(buf.validate.field).repeated = {
    min_items: 1
    unique: true
    items: {
      enum: {
        defined_only: true
        not_in: 0
      }
    }
  }];
}

enum DaemonMode {
  DAEMON_MODE_UNSPECIFIED = 0;
  DAEMON_MODE_LOCAL = 1;
  DAEMON_MODE_SUPERVISOR = 2;
  DAEMON_MODE_HOST = 3;
}

enum DoctorStatus {
  DOCTOR_STATUS_UNSPECIFIED = 0;
  DOCTOR_STATUS_HEALTHY = 1;
  DOCTOR_STATUS_UNAVAILABLE = 2;
  DOCTOR_STATUS_INCOMPATIBLE = 3;
  DOCTOR_STATUS_CORRUPT = 4;
}

enum DoctorCheckKind {
  DOCTOR_CHECK_KIND_UNSPECIFIED = 0;
  DOCTOR_CHECK_KIND_LIFECYCLE_LOCK = 1;
  DOCTOR_CHECK_KIND_SUPERVISOR_DATABASE = 2;
  DOCTOR_CHECK_KIND_HOST_DATABASE = 3;
  DOCTOR_CHECK_KIND_LOCAL_HOST_REGISTRATION = 4;
  DOCTOR_CHECK_KIND_AUTH_BROKER = 5;
  DOCTOR_CHECK_KIND_AUTH_GATEWAY = 6;
  DOCTOR_CHECK_KIND_CREDENTIAL_VAULT = 7;
  DOCTOR_CHECK_KIND_JJ_CAPABILITY = 8;
}

enum DoctorCheckStatus {
  DOCTOR_CHECK_STATUS_UNSPECIFIED = 0;
  DOCTOR_CHECK_STATUS_PASSED = 1;
  DOCTOR_CHECK_STATUS_FAILED = 2;
}

message GetHealthRequest {}

message GetHealthResponse {
  string instance_id = 1 [(buf.validate.field).string.uuid = true];
  DaemonMode mode = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  optional string host_id = 3 [(buf.validate.field).string.uuid = true];
  google.protobuf.Timestamp started_at = 4 [(buf.validate.field).required = true];
}

message RunDoctorRequest {}

message DoctorCheck {
  DoctorCheckKind kind = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  DoctorCheckStatus status = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
}

message RunDoctorResponse {
  DoctorStatus status = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  repeated DoctorCheck checks = 2 [(buf.validate.field).repeated.min_items = 1];
}
