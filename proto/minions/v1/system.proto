syntax = "proto3";

package minions.v1;

import "buf/validate/validate.proto";
import "minions/v1/common.proto";

service SystemService {
  rpc GetServerInfo(GetServerInfoRequest) returns (GetServerInfoResponse);
}

message GetServerInfoRequest {
  string client_name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
    pattern: "^[A-Za-z0-9][A-Za-z0-9._ -]*$"
  }];
  ApiVersion api_version = 2 [(buf.validate.field).required = true];
}

message GetServerInfoResponse {
  string server_version = 1 [(buf.validate.field).string = {
    pattern: "^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(?:-[0-9A-Za-z.-]+)?(?:\\+[0-9A-Za-z.-]+)?$"
  }];
  ApiVersion api_version = 2 [(buf.validate.field).required = true];
  repeated ServerCapability capabilities = 3 [(buf.validate.field).repeated = {
    min_items: 1
    unique: true
    items: {
      enum: {
        defined_only: true
        not_in: 0
      }
    }
  }];
}
