syntax = "proto3";

package minions.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

// Pairs a phone with the local supervisor over a private network. Requires
// both private-network reachability AND a valid application session; no
// public listener or relay. Pairing codes are short-lived and single-use,
// and every resulting device session is individually revocable.
service PairingService {
  rpc RequestPairingCode(RequestPairingCodeRequest) returns (RequestPairingCodeResponse);
  rpc CompletePairing(CompletePairingRequest) returns (CompletePairingResponse);
  rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse);
  rpc RevokeDevice(RevokeDeviceRequest) returns (RevokeDeviceResponse);
}

// Access scope granted to a paired device.
enum PairingScope {
  PAIRING_SCOPE_UNSPECIFIED = 0;
  PAIRING_SCOPE_READ_ONLY = 1;
  PAIRING_SCOPE_CONTROL = 2;
}

message RequestPairingCodeRequest {
  PairingScope scope = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
}

// A freshly generated pairing code: a 6-character legible alphanumeric string
// (uppercase, excludes ambiguous 0/O/1/I/L) that a human keys into the
// pairing device before expires_at.
message RequestPairingCodeResponse {
  string code = 1 [(buf.validate.field).string.pattern = "^[2-9A-HJKMNP-Z]{6}$"];
  google.protobuf.Timestamp expires_at = 2 [(buf.validate.field).required = true];
  PairingScope scope = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
}

message CompletePairingRequest {
  string code = 1 [(buf.validate.field).string.pattern = "^[2-9A-HJKMNP-Z]{6}$"];
  string device_label = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

message CompletePairingResponse {
  DeviceSession session = 1 [(buf.validate.field).required = true];
}

// An active paired-device session. Scope and label are immutable for the
// life of the session; a device must re-pair to change scope.
message DeviceSession {
  string session_id = 1 [(buf.validate.field).string.uuid = true];
  string device_label = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  PairingScope scope = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  google.protobuf.Timestamp created_at = 4 [(buf.validate.field).required = true];
  google.protobuf.Timestamp last_seen_at = 5 [(buf.validate.field).required = true];
}

message ListDevicesRequest {}

message ListDevicesResponse {
  repeated DeviceSession devices = 1;
}

message RevokeDeviceRequest {
  string session_id = 1 [(buf.validate.field).string.uuid = true];
}

message RevokeDeviceResponse {}
