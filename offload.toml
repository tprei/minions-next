version = 1

[worker]
memory_mb = 4096
max = 1
egress = ["buf.build", "github.com", "release-assets.githubusercontent.com"]

[setup]
inputs = [
  "package.json",
  "pnpm-workspace.yaml",
  "pnpm-lock.yaml",
  "apps/cli/package.json",
  "apps/daemon/package.json",
  "apps/web/package.json",
  "packages/adapters/package.json",
  "packages/contracts/package.json",
  "packages/core/package.json",
  "packages/testkit/package.json",
  "packages/ui-kit/package.json",
]
run = [
  "curl -fsSL --retry 3 -o /tmp/node.tar.xz https://nodejs.org/dist/v24.18.0/node-v24.18.0-linux-x64.tar.xz",
  'echo "55aa7153f9d88f28d765fcdad5ae6945b5c0f98a36881703817e4c450fa76742  /tmp/node.tar.xz" | sha256sum --check',
  "mkdir -p ~/.local/bin && tar -xJf /tmp/node.tar.xz -C ~/.local",
  "ln -sfn ~/.local/node-v24.18.0-linux-x64/bin/node ~/.local/bin/node",
  "ln -sfn ~/.local/node-v24.18.0-linux-x64/bin/npm ~/.local/bin/npm",
  "npm i -g --prefix ~/.local pnpm@10.34.5",
  # credential-vault's always-run probe stats /usr/bin/systemd-creds; CI runners ship it from the systemd package
  "sudo apt-get update && sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends systemd",
  "pnpm install --frozen-lockfile",
  "curl -fsSL --retry 3 -o /tmp/omp https://github.com/can1357/oh-my-pi/releases/download/v17.1.3/omp-linux-x64",
  'echo "17a7e2e1c49cbc09129e29fbf48cdebd1a545d053f5cad7295c1898b6eaa422e  /tmp/omp" | sha256sum --check',
  "sudo install -m 755 /tmp/omp /usr/local/bin/omp",
]

[tasks.check]
run = "pnpm format:check && pnpm lint && pnpm typecheck && pnpm deadcode && pnpm test:unit"
timeout = "30m"

[tasks.protobuf]
run = "pnpm generate:check && pnpm proto:lint"
timeout = "20m"

[tasks.integration]
run = "pnpm test:integration"
timeout = "30m"
env = { LIVE_DEPS = "omp", OMP_PATH = "/usr/local/bin/omp" }

[tasks.security]
run = "pnpm test:security"
timeout = "30m"

[tasks.build]
run = "pnpm build"
timeout = "20m"
